name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - name: All gates (format, lint, types, duplicates, unused, coverage, static build)
        run: npm run check
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests, light and dark
        run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan full history for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact
